# Render Blueprint Specification for BookLeaf Portal
# Deploys FastAPI Backend Web Service connected to Render Managed PostgreSQL
services:
  - type: web
    name: bookleaf-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://localhost:5173,https://localhost:3000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: USE_CELERY
        value: "false"
      - key: RATE_LIMIT_ENABLED
        value: "true"

databases:
  - name: bookleaf-db
    plan: free
    region: oregon
    databaseName: bookleaf_db
    user: bookleaf_user
